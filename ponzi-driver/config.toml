# ═══════════════════════════════════════════════════════════════════════════
# Ponzi — Configuração do driver da mesa digitalizadora
# Gotop / SZ PING-IT T1161 (VID 08F2, PID 6811)
# ═══════════════════════════════════════════════════════════════════════════

[device]
vendor_id = 0x08F2
product_id = 0x6811

[tablet]
resolution_x = 4096
resolution_y = 4096

# ── Mapeamento de Área ────────────────────────────────────────────────────
[mapping]
tablet_left = 0
tablet_top = 0
tablet_right = 4095
tablet_bottom = 4095

screen_left = 0
screen_top = 0
screen_right = 4095
screen_bottom = 4095

force_proportions = false
rotation = 0
# "Absolute" = pen position maps to screen position (drawing)
# "Relative" = pen movement maps to cursor delta (osu!/mouse mode)
mode = "Absolute"
sensitivity_x = 1.0
sensitivity_y = 1.0

# ── Orientação ───────────────────────────────────────────────────────────
[orientation]
flip_x = false
flip_y = false
left_hand = false

# ── Pressão ──────────────────────────────────────────────────────────────
[pressure]
touch_threshold = 1510
pressure_range = 530
max_pressure = 65535
min_pressure_threshold = 0
curve = "linear"
gamma = 1.0

# ── Suavização ───────────────────────────────────────────────────────────
[smoothing]
enabled = false
level = 3
anti_chatter = false
anti_chatter_threshold = 2

# ── Express Keys — Excalidraw defaults ───────────────────────────────────
[buttons]
b1 = ["LEFTCTRL", "Z"]          # Undo
b2 = ["LEFTCTRL", "LEFTSHIFT", "Z"] # Redo
b3 = ["P"]                       # Pen/Draw
b4 = ["E"]                       # Eraser
b5 = ["V"]                       # Select
b6 = ["H"]                       # Hand/Pan
b7 = ["DELETE"]                   # Delete
b8 = ["LEFTCTRL", "D"]           # Duplicate
b9 = ["LEFTCTRL", "A"]           # Select All
b10 = ["LEFTSHIFT", "1"]         # Zoom to fit
b11 = ["S"]                      # Stroke color
b12 = ["LEFTALT"]

# ── Botões da Caneta ─────────────────────────────────────────────────────
[pen_buttons]
# Key combos separated by comma. Ex: LEFTCTRL, EQUAL = Ctrl++
stylus = ["LEFTCTRL", "EQUAL"]     # Lower barrel: Zoom in (Ctrl+)
eraser = ["LEFTCTRL", "MINUS"]     # Upper barrel: Zoom out (Ctrl-)
tip = ["BTN_LEFT"]                  # Tip touch: Left click
